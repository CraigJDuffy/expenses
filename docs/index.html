<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Expenses Form</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --primary: #0066cc;
      --primary-dark: #004c99;
      --border: #d9d9d9;
      --radius: 12px;
      --text: #222;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: var(--bg);
      margin: 0;
      padding: 16px;
      color: var(--text);
      font-size: 18px; /* ⭐ Bigger base font for mobile */
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2, h3 {
      margin-top: 0;
      font-weight: 600;
      font-size: 24px;
    }

    label {
      display: block;
      font-size: 16px;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input, button {
      width: 100%;
      padding: 16px; /* ⭐ Larger tap targets */
      margin: 4px 0 14px 0;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 18px;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0,102,204,0.2);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 20px;
      padding: 18px;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .expense-block {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-top: 16px;
      background: #fafbfc;
    }

    .expense-title {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 18px;
    }

    #totalDisplay {
      font-size: 22px;
      font-weight: bold;
      margin-top: 16px;
      text-align: right;
      color: var(--primary-dark);
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="card">
      <h2>Expenses Submission</h2>

      <form id="expensesForm" enctype="multipart/form-data">

        <label>Name</label>
        <input type="text" name="name" placeholder="Your Name" required>

        <label>Membership Number</label>
        <input type="text" name="membership" placeholder="Membership Number" required>

        <h3>Expenses</h3>
        <div id="expenses"></div>

        <button type="button" onclick="addExpense()">+ Add Expense</button>

        <div id="totalDisplay">Total: £0.00</div>

        <h3>Receipts</h3>
        <label>Receipt 1</label>
        <input type="file" name="receipt1">
        <label>Receipt 2</label>
        <input type="file" name="receipt2">
        <label>Receipt 3</label>
        <input type="file" name="receipt3">

        <h3>Bank Details</h3>
        <label>Account Number</label>
        <input type="text" name="account_number" placeholder="Account Number" inputmode="numeric" pattern="\d{6,8}" title="6-8 digits" required>

        <label>Sort Code</label>
        <input type="text" name="sort_code" placeholder="00-00-00" inputmode="numeric" pattern="\d{2}-?\d{2}-?\d{2}" title="Format: 00-00-00" required>

        <button type="submit">Submit</button>
      </form>
    </div>

  </div>

  <script>
    let expenseCount = 0;

    function addExpense() {
      expenseCount++;
      const container = document.getElementById("expenses");

      const block = document.createElement("div");
      block.className = "expense-block";
      block.innerHTML = `
        <div class="expense-title">Expense ${expenseCount}</div>

        <label>Date</label>
        <input type="date" name="expense_${expenseCount}_date" required>

        <label>Details</label>
        <input type="text" name="expense_${expenseCount}_details" placeholder="Details" required>

        <label>Amount (£)</label>
        <input type="number" name="expense_${expenseCount}_amount" placeholder="Amount (£)" step="0.01" required oninput="updateTotal()">
      `;
      container.appendChild(block);

      updateTotal();
    }

    function updateTotal() {
      let total = 0;
      const amountInputs = document.querySelectorAll('input[name^="expense_"][name$="_amount"]');

      amountInputs.forEach(input => {
        const value = parseFloat(input.value);
        if (!isNaN(value)) total += value;
      });

      document.getElementById("totalDisplay").textContent = `Total: £${total.toFixed(2)}`;
    }

    document.getElementById("expensesForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);

      const response = await fetch("https://expenses-backend.cjduffyexpenses.workers.dev/", {
        method: "POST",
        body: formData
      });

      alert(await response.text());
    });

    addExpense();
  </script>

</body>
</html>
