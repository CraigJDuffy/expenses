<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Expenses Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; }
    .expense-row { display: flex; gap: 10px; }
    .expense-row input { flex: 1; }
  </style>
</head>
<body>

  <h2>Expenses Submission</h2>

  <form id="expensesForm" enctype="multipart/form-data">

    <input type="text" name="name" placeholder="Your Name" required>
    <input type="text" name="membership" placeholder="Membership Number" required>

    <h3>Expenses</h3>
    <div id="expenses"></div>

    <button type="button" onclick="addExpense()">Add Expense</button>

    <h3>Receipts</h3>
    <input type="file" name="receipt1">
    <input type="file" name="receipt2">
    <input type="file" name="receipt3">

    <button type="submit">Submit</button>
  </form>

  <script>
    let expenseCount = 0;

    function addExpense() {
      expenseCount++;
      const container = document.getElementById("expenses");

      const row = document.createElement("div");
      row.className = "expense-row";
      row.innerHTML = `
        <input type="text" name="expense_${expenseCount}_date" placeholder="Date" required>
        <input type="text" name="expense_${expenseCount}_details" placeholder="Details" required>
        <input type="number" name="expense_${expenseCount}_amount" placeholder="Amount" required>
      `;
      container.appendChild(row);
    }

    document.getElementById("expensesForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);

      const response = await fetch("https://expenses-backend.cjduffyexpenses.workers.dev/", {
        method: "POST",
        body: formData
      });

      alert(await response.text());
    });
  </script>

</body>
</html>
